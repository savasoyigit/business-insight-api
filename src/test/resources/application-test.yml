# Integration tests run against a real PostgreSQL (CI: service container; locally: e.g. docker compose).
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/businessinsight_test}
    username: ${TEST_DB_USER:app}
    password: ${TEST_DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

app:
  insight:
    execution:
      max-rows: 5000
      snapshot-rows: 500
      query-timeout-seconds: 30
      snapshot-retention: 3
    connection:
      # The live pipeline tests use the test database on localhost as their "external" database.
      allow-loopback: true
    scheduler:
      # Tests drive DatasetRefreshScheduler#refreshDueDatasets directly.
      enabled: false
  metrics:
    scrape-token: integration-test-scrape-token-0123456789
  security:
    secrets-key: q83vEjRWeJq83vEjRWeJq83vEjRWeJq83vEjRWeJq80=
    jwt:
      secret: integration-test-secret-that-is-long-enough-0123456789
    hardening:
      # Tests log in many times from the same address.
      login-rate-limit-per-minute: 10000
