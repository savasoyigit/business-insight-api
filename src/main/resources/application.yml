server:
  port: 8080
  # Behind a reverse proxy set this to "native": Tomcat then takes the client address from X-Forwarded-For,
  # but only when the request comes from a trusted proxy (server.tomcat.remoteip.internal-proxies).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/businessinsight
    username: app
    password: app
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-none}]"

app:
  cors:
    # Comma-separated origins allowed to call the API from a browser (Insight Studio frontend).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  insight:
    execution:
      max-rows: 5000
      snapshot-rows: 500
      query-timeout-seconds: 30
      async-threads: 4
      async-queue-capacity: 100
      snapshot-retention: 50
    connection:
      # secretRef env:VAR may only name variables with this prefix (e.g. env:DS_SECRET_ERP), never JWT_SECRET & co.
      env-secret-prefix: ${INSIGHT_ENV_SECRET_PREFIX:DS_SECRET_}
      # Datasource hosts on loopback (localhost) are refused unless enabled, e.g. for local development.
      allow-loopback: ${INSIGHT_ALLOW_LOOPBACK:false}
      # Private networks (10/8, 172.16/12, 192.168/16, ...) are where company databases usually live.
      allow-private-networks: ${INSIGHT_ALLOW_PRIVATE_NETWORKS:true}
    scheduler:
      enabled: true
      poll-interval: 30s
      zone: ${INSIGHT_SCHEDULER_ZONE:UTC}
      min-interval-minutes: 5
  security:
    # Base64-encoded 32-byte key for encrypting datasource passwords (AES-256-GCM). Empty disables encrypted passwords.
    # Generate one with: openssl rand -base64 32
    secrets-key: ${APP_SECRETS_KEY:}
    jwt:
      secret: ${JWT_SECRET}
      issuer: business-insight-api
      access-token-minutes: 30
    hardening:
      login-rate-limit-per-minute: 10
      max-failed-login-attempts: 5
      lockout-minutes: 15
      min-password-length: 12
