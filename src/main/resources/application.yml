server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/businessinsight
    username: app
    password: app
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-none}]"

app:
  cors:
    # Comma-separated origins allowed to call the API from a browser (Insight Studio frontend).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  insight:
    execution:
      max-rows: 5000
      snapshot-rows: 500
      query-timeout-seconds: 30
  security:
    # Base64-encoded 32-byte key for encrypting datasource passwords (AES-256-GCM). Empty disables encrypted passwords.
    # Generate one with: openssl rand -base64 32
    secrets-key: ${APP_SECRETS_KEY:}
    jwt:
      secret: ${JWT_SECRET}
      issuer: business-insight-api
      access-token-minutes: 30
    hardening:
      login-rate-limit-per-minute: 10
      max-failed-login-attempts: 5
      lockout-minutes: 15
      min-password-length: 12
